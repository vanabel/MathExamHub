name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (LaTeX processor)
        run: npm test

  backend-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check for merge conflict markers
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-no-conflict-markers.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install XeLaTeX (export compile + unit tests with compile)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-chinese texlive-fonts-recommended texlive-latex-recommended texlive-latex-extra poppler-utils unzip
      - name: Unit tests
        run: npm test
      - name: Scenario tests (Mongo + XeLaTeX)
        env:
          MONGODB_URI: mongodb://localhost:27017/mathexam_ci_scenario
          SCENARIO_PORT: 3099
        run: npm run test:scenario
      - name: LaTeX export compile smoke
        env:
          MONGODB_URI: mongodb://localhost:27017/mathexam_ci_latex_compile
          SCENARIO_PORT: 3101
        run: npm run test:latex-compile
      - name: List pagination benchmark (10k seed)
        env:
          MONGODB_URI: mongodb://localhost:27017/mathexam_ci_bench
          BENCH_TARGET_COUNT: 10000
          BENCH_P95_MS: 3000
        run: npm run test:bench
      - name: Smoke API health
        env:
          MONGODB_URI: mongodb://localhost:27017/mathexam_ci
          SESSION_SECRET: ci-test-secret
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              curl -sf http://localhost:3000/api/health | grep -q '"ok":true'
              kill $SERVER_PID
              wait $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  e2e-smoke:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - name: Check for merge conflict markers
        run: bash scripts/check-no-conflict-markers.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright (Chromium)
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Install XeLaTeX (e2e export compile)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-chinese texlive-fonts-recommended texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-science unzip
      - name: Build frontend
        working-directory: frontend
        env:
          VUE_APP_API_BASE_URL: http://127.0.0.1:3000/api
        run: npm run build
      - name: Playwright smoke
        env:
          MONGODB_URI: mongodb://localhost:27017/mathexam_ci_e2e
          SESSION_SECRET: ci-e2e-secret
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: |
          node backend/server.js &
          BACK_PID=$!
          npx --yes serve@14 -s frontend/dist -l 8080 &
          FE_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null && curl -sf http://127.0.0.1:8080/login >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health
          curl -sf http://127.0.0.1:8080/login | head -c 200
          E2E_COMPILE_TEX=1 PLAYWRIGHT_API_URL=http://127.0.0.1:3000/api npm --prefix e2e test
          kill $BACK_PID $FE_PID 2>/dev/null || true
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: ignore
