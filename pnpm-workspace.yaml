# pnpm 11+ reads settings here (not root .npmrc / not package.json#pnpm).
# Only the repo root is a pnpm workspace member; backend/frontend use npm ci separately.
packages:
  - '.'

verifyDepsBeforeRun: false
# If a pre-run install still runs, do not fail on denied electron postinstall (NAS prod).
strictDepBuilds: false
allowBuilds:
  electron: false
  nodemon: false
  npm-run-all: false
